parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    HamidouIe\KeycloakClientBundle\:
        resource: '../../*'
        exclude: '../../{Entity,Migrations,Tests,Token/KeycloakResourceOwner.php,EventSubscriber/TokenAuthListener.php,Security/User/DoctrineOidcUserProvider.php}'

    HamidouIe\KeycloakClientBundle\Interface\IamClientInterface:
        public: true
        alias: HamidouIe\KeycloakClientBundle\Provider\KeycloakClient

    HamidouIe\KeycloakClientBundle\Provider\KeycloakClient:
        bind:
              bool $verify_ssl: '%hamidou_ie_keycloak_client.keycloak.verify_ssl%'
              string $base_url: '%hamidou_ie_keycloak_client.keycloak.base_url%'
              string $realm: '%hamidou_ie_keycloak_client.keycloak.realm%'
              string $client_id: '%hamidou_ie_keycloak_client.keycloak.client_id%'
              string $client_secret: '%hamidou_ie_keycloak_client.keycloak.client_secret%'
              string $redirect_uri: '%hamidou_ie_keycloak_client.keycloak.redirect_uri%'
              string $encryption_algorithm: '%hamidou_ie_keycloak_client.keycloak.encryption_algorithm%'
              string $encryption_key: '%hamidou_ie_keycloak_client.keycloak.encryption_key%'
              string $encryption_key_path: '%hamidou_ie_keycloak_client.keycloak.encryption_key_path%'
              string $version: '%hamidou_ie_keycloak_client.keycloak.version%'

    HamidouIe\KeycloakClientBundle\Provider\KeycloakAdminClient:
        bind:
              bool $verify_ssl: '%hamidou_ie_keycloak_client.keycloak.verify_ssl%'
              string $base_url: '%hamidou_ie_keycloak_client.keycloak.base_url%'
              string $admin_realm: '%hamidou_ie_keycloak_client.admin_cli.realm%'
              string $admin_client_id: '%hamidou_ie_keycloak_client.admin_cli.client_id%'
              string $admin_username: '%hamidou_ie_keycloak_client.admin_cli.username%'
              string $admin_password: '%hamidou_ie_keycloak_client.admin_cli.password%'
              string $version: '%hamidou_ie_keycloak_client.keycloak.version%'

    HamidouIe\KeycloakClientBundle\Controller\KeycloakController:
        public: true
        bind:
              $defaultTargetRouteName: '%hamidou_ie_keycloak_client.security.default_target_route_name%'
        tags: [ 'controller.service_arguments' ]

    HamidouIe\KeycloakClientBundle\Security\User\KeycloakUserProvider:
        public: true
#        tags:
#            - { name: mainick_keycloak_security.user_provider, alias: oauth }

    HamidouIe\KeycloakClientBundle\EventSubscriber\ExceptionListener:
        public: true
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

    HamidouIe\KeycloakClientBundle\EventSubscriber\LogoutAuthListener:
        public: true
        arguments:
              $defaultTargetRouteName: '%hamidou_ie_keycloak_client.security.default_target_route_name%'
        tags:
            - { name: kernel.event_listener, event: 'Symfony\Component\Security\Http\Event\LogoutEvent', priority: -10 }

    # Rimuovi questi normalizzatori dall'autowiring automatico per evitare
    # che Symfony provi a iniettare dipendenze circolari
    HamidouIe\KeycloakClientBundle\Serializer\CollectionDenormalizer:
        autowire: false
        autoconfigure: false
        public: false
        # Non aggiungere tag

    HamidouIe\KeycloakClientBundle\Serializer\AttributeNormalizer:
        autowire: false
        autoconfigure: false
        public: false
        # Non aggiungere tag

    HamidouIe\KeycloakClientBundle\Serializer\RepresentationDenormalizer:
        autowire: false
        autoconfigure: false
        public: false


#    HamidouIe\KeycloakClientBundle\Security\EntryPoint\KeycloakAuthenticationEntryPoint: ~
#    HamidouIe\KeycloakClientBundle\Security\Authenticator\KeycloakAuthenticator: ~
